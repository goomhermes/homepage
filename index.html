<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://raw.githubusercontent.com data: blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>굼마의 집</title>
<style>
  :root {
    --ink: #070a18;
    --panel: rgba(8, 12, 34, 0.82);
    --panel-strong: rgba(7, 10, 24, 0.94);
    --panel-soft: rgba(22, 34, 76, 0.72);
    --gold: #f4c760;
    --gold-soft: rgba(244, 199, 96, 0.52);
    --crimson: #d85754;
    --cyan: #82d6ff;
    --mist: #d9f1ff;
    --paper: #fff0c6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    height: 100vh;
    background: var(--ink);
    color: var(--paper);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }

  body::before {
    background:
      linear-gradient(rgba(255,255,255,0.035) 50%, rgba(0,0,0,0.045) 50%),
      linear-gradient(90deg, rgba(255,0,80,0.025), rgba(0,255,255,0.018), rgba(255,255,255,0));
    background-size: 100% 4px, 6px 100%;
    mix-blend-mode: soft-light;
  }

  body::after {
    background:
      radial-gradient(circle at 50% 42%, transparent 0 48%, rgba(3, 5, 16, 0.3) 78%, rgba(0, 0, 0, 0.54) 100%),
      linear-gradient(180deg, rgba(10, 13, 28, 0.12), rgba(5, 7, 18, 0.34));
  }
  
  #canvas-container {
    width: 100%;
    height: 100vh;
    position: relative;
  }

  #canvas-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(7, 10, 24, 0.12), transparent 24%, transparent 70%, rgba(7, 10, 24, 0.36)),
      radial-gradient(circle at 18% 18%, rgba(130, 214, 255, 0.18), transparent 28%),
      radial-gradient(circle at 82% 26%, rgba(244, 199, 96, 0.14), transparent 30%);
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  #ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  
  #title {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    min-width: min(78vw, 520px);
    padding: 10px 26px 12px;
    color: var(--paper);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.45rem, 2.5vw, 2.65rem);
    line-height: 1;
    text-align: center;
    text-shadow: 0 2px 0 #27160b, 0 0 22px rgba(244, 199, 96, 0.42);
    letter-spacing: 0;
    border: 1px solid var(--gold);
    border-radius: 6px;
    background:
      linear-gradient(180deg, rgba(34, 50, 101, 0.92), rgba(5, 8, 25, 0.9)),
      linear-gradient(90deg, rgba(216, 87, 84, 0.38), transparent 28%, transparent 72%, rgba(130, 214, 255, 0.32));
    box-shadow:
      inset 0 0 0 2px rgba(255, 238, 184, 0.1),
      0 12px 36px rgba(0, 0, 0, 0.34);
    opacity: 0;
    animation: fadeIn 2s ease 0.5s forwards;
  }

  #title::before,
  #title::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 12px;
    height: 12px;
    border: 1px solid var(--gold);
    background: var(--crimson);
    transform: translateY(-50%) rotate(45deg);
    box-shadow: 0 0 14px rgba(216, 87, 84, 0.7);
  }

  #title::before { left: 12px; }
  #title::after { right: 12px; }
  
  #hint {
    position: absolute;
    top: 92px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 18px;
    color: var(--mist);
    font-size: 0.78rem;
    line-height: 1.3;
    letter-spacing: 0;
    text-transform: uppercase;
    border: 1px solid rgba(130, 214, 255, 0.34);
    border-radius: 5px;
    background: rgba(5, 8, 25, 0.56);
    box-shadow: 0 0 18px rgba(130, 214, 255, 0.14);
    opacity: 0;
    animation: fadeIn 2s ease 1.2s forwards, pulse 3s ease-in-out infinite 4s;
  }

  #zarathustra-link,
  #child-clothing-link,
  .esl-link {
    position: absolute;
    left: 24px;
    width: min(280px, calc(100vw - 48px));
    color: var(--paper);
    font-size: 0.82rem;
    line-height: 1.15;
    text-decoration: none;
    padding: 9px 14px 9px 20px;
    border: 1px solid rgba(244, 199, 96, 0.54);
    border-left: 4px solid var(--gold);
    border-radius: 5px;
    background:
      linear-gradient(180deg, rgba(22, 34, 76, 0.88), rgba(5, 8, 25, 0.84)),
      linear-gradient(90deg, rgba(216, 87, 84, 0.18), transparent);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 8px 22px rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(8px);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    pointer-events: auto;
    opacity: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #zarathustra-link { top: 24px; animation: fadeIn 1.4s ease 0.9s forwards; }
  #child-clothing-link { top: 66px; animation: fadeIn 1.4s ease 1s forwards; }
  .esl-link { animation: fadeIn 1.4s ease 1.1s forwards; }

  #zarathustra-link:hover,
  #child-clothing-link:hover {
    border-color: var(--paper);
    background:
      linear-gradient(180deg, rgba(48, 64, 132, 0.94), rgba(11, 15, 42, 0.9)),
      linear-gradient(90deg, rgba(216, 87, 84, 0.28), transparent);
    transform: translateX(6px);
  }

  .esl-link:hover {
    border-color: var(--cyan);
    background:
      linear-gradient(180deg, rgba(42, 60, 124, 0.94), rgba(8, 12, 34, 0.9)),
      linear-gradient(90deg, rgba(130, 214, 255, 0.22), transparent);
    transform: translateX(6px);
  }

  #info-panel {
    position: absolute;
    right: 92px;
    bottom: 24px;
    width: min(460px, calc(100vw - 380px));
    min-height: 112px;
    background: var(--panel-strong);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 18px 22px 20px;
    color: var(--paper);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: auto;
    backdrop-filter: blur(10px);
    box-shadow:
      inset 0 0 0 2px rgba(255, 238, 184, 0.08),
      0 18px 42px rgba(0, 0, 0, 0.38);
  }

  #info-panel.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #info-panel h3 {
    font-size: 1rem;
    margin-bottom: 8px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(244, 199, 96, 0.25);
  }

  #info-panel p {
    font-size: 0.88rem;
    line-height: 1.55;
    color: #f8e7bb;
  }

  #loading {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 50% 42%, rgba(37, 61, 125, 0.86), rgba(7, 10, 24, 0.98) 66%),
      #070a18;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 1s ease;
  }
  
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  .loader {
    width: 60px;
    height: 60px;
    border: 3px solid rgba(244, 199, 96, 0.18);
    border-top-color: var(--gold);
    border-right-color: var(--cyan);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  #loading p {
    margin-top: 20px;
    color: var(--paper);
    letter-spacing: 0;
    font-size: 0.9rem;
  }
  
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.4; }
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  #edit-toggle {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 54px;
    height: 44px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, rgba(26, 40, 88, 0.92), rgba(6, 9, 27, 0.92));
    backdrop-filter: blur(10px);
    color: var(--paper);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0;
    cursor: pointer;
    z-index: 20;
    pointer-events: auto;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #edit-toggle:hover {
    border-color: var(--paper);
    transform: translateY(-2px);
  }
  #edit-toggle.active {
    background: linear-gradient(180deg, rgba(216, 87, 84, 0.94), rgba(80, 18, 34, 0.94));
    color: #fff6d8;
    border-color: #fff0c6;
  }
  #edit-panel {
    position: fixed;
    bottom: 86px;
    right: 28px;
    width: min(310px, calc(100vw - 56px));
    background: var(--panel-strong);
    backdrop-filter: blur(12px);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 16px;
    z-index: 20;
    pointer-events: auto;
    display: none;
    font-size: 0.85rem;
    color: var(--paper);
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
  }
  #edit-panel.visible { display: block; }
  #edit-panel h4 {
    margin: 0 0 10px 0;
    font-size: 0.95rem;
    color: var(--gold);
    border-bottom: 1px solid rgba(244,199,96,0.28);
    padding-bottom: 6px;
  }
  #edit-panel label {
    display: block;
    margin-top: 8px;
    font-weight: 600;
    font-size: 0.8rem;
  }
  #edit-panel select,
  #edit-panel input[type=range] {
    width: 100%;
    margin-top: 3px;
  }
  #edit-panel select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid rgba(244,199,96,0.36);
    background: rgba(6, 9, 27, 0.92);
    color: var(--paper);
    font-size: 0.8rem;
  }
  #edit-panel input[type=range] { accent-color: var(--gold); }
  #edit-panel .val {
    font-weight: 400;
    color: var(--cyan);
    float: right;
  }
  #edit-panel button {
    margin-top: 10px;
    width: 100%;
    padding: 7px 0;
    border-radius: 8px;
    border: 1px solid rgba(244,199,96,0.42);
    background: rgba(244,199,96,0.1);
    color: var(--paper);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  #edit-panel button:hover { background: rgba(244,199,96,0.2); }
  #edit-panel button.danger {
    color: #ffd4d2;
    border-color: rgba(216,87,84,0.48);
    background: rgba(216,87,84,0.12);
  }
  #edit-panel button.danger:hover { background: rgba(216,87,84,0.24); }
  .edit-selected-outline {
    outline: 2px solid #ff6b6b;
    outline-offset: 2px;
  }

  /* Particle effects */
  .sakura-petal {
    position: fixed;
    width: 12px;
    height: 12px;
    background: radial-gradient(ellipse at center, #ffb4c8 0%, #ff8fab 50%, transparent 70%);
    border-radius: 50% 0 50% 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    animation: fall linear forwards;
  }

  #keypad-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(28, 45, 96, 0.36), rgba(0, 0, 0, 0.74)),
      rgba(0, 0, 0, 0.6);
    z-index: 9999;
  }

  .keypad-dialog {
    width: min(292px, calc(100vw - 48px));
    padding: 22px;
    text-align: center;
    color: var(--paper);
    background: var(--panel-strong);
    border: 1px solid var(--gold);
    border-radius: 6px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255, 238, 184, 0.08);
  }

  .keypad-dialog h3 {
    margin: 0 0 12px;
    color: var(--gold);
    font-size: 1rem;
  }

  #keypad-display {
    min-height: 2.4rem;
    margin: 12px 0;
    padding: 8px;
    color: var(--cyan);
    font-size: 1.8rem;
    letter-spacing: 0.26em;
    background: rgba(0, 0, 0, 0.32);
    border: 1px solid rgba(130, 214, 255, 0.24);
    border-radius: 5px;
  }

  #keypad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0;
  }

  .keypad-key {
    padding: 13px 0;
    color: var(--paper);
    font-size: 1.05rem;
    font-weight: 800;
    border: 1px solid rgba(244, 199, 96, 0.44);
    border-radius: 5px;
    background: linear-gradient(180deg, rgba(39, 55, 117, 0.92), rgba(8, 12, 34, 0.94));
    cursor: pointer;
  }

  .keypad-key:hover {
    border-color: var(--paper);
    background: linear-gradient(180deg, rgba(66, 82, 158, 0.95), rgba(17, 24, 62, 0.95));
  }

  .keypad-note {
    margin-top: 8px;
    color: rgba(255, 240, 198, 0.68);
    font-size: 0.75rem;
  }
  
  @keyframes fall {
    0% {
      opacity: 0;
      transform: translateY(-20px) rotate(0deg);
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.6;
    }
    100% {
      opacity: 0;
      transform: translateY(100vh) rotate(720deg);
    }
  }

  @media (max-width: 1180px) and (min-width: 761px) {
    #zarathustra-link { top: 118px; }
    #child-clothing-link { top: 160px; }
    .esl-link[style*="110px"] { top: 202px !important; }
    .esl-link[style*="148px"] { top: 240px !important; }
    .esl-link[style*="186px"] { top: 278px !important; }
    .esl-link[style*="224px"] { top: 316px !important; }
    .esl-link[style*="262px"] { top: 354px !important; }
  }

  @media (max-width: 760px) {
    #title {
      top: 14px;
      min-width: calc(100vw - 32px);
      padding: 9px 22px 10px;
    }

    #hint {
      top: 76px;
      width: calc(100vw - 36px);
      text-align: center;
    }

    #zarathustra-link,
    #child-clothing-link,
    .esl-link {
      left: 16px;
      width: calc(100vw - 32px);
      font-size: 0.76rem;
      padding: 8px 12px 8px 16px;
    }

    #zarathustra-link { top: 118px; }
    #child-clothing-link { top: 156px; }
    .esl-link[style*="110px"] { top: 194px !important; }
    .esl-link[style*="148px"] { top: 232px !important; }
    .esl-link[style*="186px"] { top: 270px !important; }
    .esl-link[style*="224px"] { top: 308px !important; }
    .esl-link[style*="262px"] { top: 346px !important; }

    #info-panel {
      left: 16px;
      right: 86px;
      bottom: 18px;
      width: auto;
      min-height: 96px;
      padding: 14px 16px;
    }

    #edit-toggle {
      right: 18px;
      bottom: 18px;
    }

    #edit-panel {
      right: 18px;
      bottom: 72px;
      max-height: 58vh;
    }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Scene setup - PS-era JRPG dusk
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fa7ff);
scene.fog = new THREE.FogExp2(0x93b6ff, 0.011);

const skyUniforms = {
  uTop: { value: new THREE.Color(0x18205a) },
  uMid: { value: new THREE.Color(0x7f9cf6) },
  uBottom: { value: new THREE.Color(0xffd38a) }
};
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(420, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uTop;
      uniform vec3 uMid;
      uniform vec3 uBottom;
      varying vec3 vWorldPosition;
      void main() {
        float h = normalize(vWorldPosition).y * 0.5 + 0.5;
        vec3 low = mix(uBottom, uMid, smoothstep(0.08, 0.55, h));
        vec3 color = mix(low, uTop, smoothstep(0.45, 1.0, h));
        gl_FragColor = vec4(color, 1.0);
      }
    `
  })
);
scene.add(skyDome);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(38, 24, 68);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 14;
controls.maxDistance = 120;
controls.target.set(0, 3, 0);

// Lighting
const ambientLight = new THREE.AmbientLight(0xa7b7ff, 0.82);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffd79a, 2.45);
sunLight.position.set(32, 48, 18);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
scene.add(sunLight);

// Soft fill light
const fillLight = new THREE.DirectionalLight(0x6fd6ff, 0.58);
fillLight.position.set(-20, 20, -10);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xd879ff, 0.55);
rimLight.position.set(-28, 22, 32);
scene.add(rimLight);

// Ground - lush green grass
const groundGeometry = new THREE.CircleGeometry(60, 64);
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x315f49,
  roughness: 0.9,
  metalness: 0.0
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

  uGold: { value: new THREE.Color(0xffd47c) }
};

  transparent: true,

    uniform float uTime;
    varying vec2 vUv;
    varying float vWave;
    void main() {
      vUv = uv;
      vec3 p = position;
      float wave = sin((p.x + uTime * 1.4) * 2.0) * 0.055;
      wave += sin((p.y - uTime * 1.1) * 3.4) * 0.035;
      p.z += wave;
      vWave = wave;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uGold;
    varying vec2 vUv;
    varying float vWave;
    void main() {
      vec2 centered = vUv - 0.5;
      float radius = length(centered) * 2.0;
      float edge = 1.0 - smoothstep(0.86, 1.0, radius);
      float ripple = sin((radius * 18.0) - (uTime * 2.4)) * 0.5 + 0.5;
      float shimmer = smoothstep(0.72, 1.0, ripple) * 0.22;
      vec3 water = mix(uDeep, uShallow, smoothstep(0.0, 0.9, 1.0 - radius));
      water = mix(water, uGold, shimmer + vWave * 1.6);
      gl_FragColor = vec4(water, edge * 0.76);
    }
  `
});

function createSmokeCloudMaterial(seed) {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0 },
      uSeed: { value: seed },
      uTint: { value: new THREE.Color(0xf4fbff) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uSeed;
      uniform vec3 uTint;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float value = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 4; i++) {
          value += noise(p) * amp;
          p *= 2.0;
          amp *= 0.5;
        }
        return value;
      }

      void main() {
        vec2 p = vUv - 0.5;
        float body = smoothstep(0.78, 0.04, length(p * vec2(1.0, 1.28)));
        float swirl = fbm(vUv * 3.2 + vec2(uTime * 0.035 + uSeed, -uTime * 0.02));
        float veil = smoothstep(0.16, 0.78, swirl) * body;
        float alpha = veil * 0.3;
        vec3 color = mix(vec3(0.84, 0.9, 1.0), uTint, swirl * 0.7);
        gl_FragColor = vec4(color, alpha);
      }
    `
  });
}

function assetFileFromUrl(url) {
  return url.replace(/^\.\//, '');
}

function normalizeNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function loadEditorState() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (parsed && parsed.version === 2 && Array.isArray(parsed.objects)) {
      return {
        version: 2,
        objects: parsed.objects.filter(Boolean)
      };
    }
  } catch (error) {
    console.warn('Could not read editor state:', error);
  }

  try {
    const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
    if (Array.isArray(legacy)) {
      return {
        version: 2,
        objects: legacy
          .filter((item) => item && item.asset)
          .map((item, index) => ({
            id: `legacy-${index}-${String(item.asset).replace(/[^a-z0-9]+/gi, '-')}`,
            type: 'placed',
            asset: item.asset,
            x: normalizeNumber(item.x),
            y: normalizeNumber(item.y),
            z: normalizeNumber(item.z),
            scale: normalizeNumber(item.scale, 1),
            rotY: normalizeNumber(item.rotY),
            category: item.category || 'edit-placed',
            deleted: false
          }))
      };
    }
  } catch (error) {
    console.warn('Could not migrate legacy editor objects:', error);
  }

  return { version: 2, objects: [] };
}

function writeEditorState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(editorState));
}

function getEditorRecord(id, includeDeleted = false) {
  return editorState.objects.find((record) => record.id === id && (includeDeleted || !record.deleted));
}

function serializeObject(obj) {
  const scale = normalizeNumber(obj.userData.currentScale, obj.scale.x || 1);
  return {
    id: obj.userData.editorId,
    type: obj.userData.editorType || 'placed',
    asset: obj.userData.assetFile || null,
    x: normalizeNumber(obj.position.x),
    y: normalizeNumber(obj.position.y),
    z: normalizeNumber(obj.position.z),
    scale,
    rotY: normalizeNumber(obj.rotation.y),
    category: obj.userData.category || 'default',
    deleted: false
  };
}

function saveAllObjects() {
  const liveRecords = interactiveObjects
    .filter((obj) => obj.userData.editorId)
    .map(serializeObject);
  const liveIds = new Set(liveRecords.map((record) => record.id));
  const deletedRecords = editorState.objects.filter((record) => record.deleted && !liveIds.has(record.id));
  editorState = {
    version: 2,
    objects: [...liveRecords, ...deletedRecords]
  };
  writeEditorState();
}

function createPlacedId(asset) {
  const suffix = Math.random().toString(36).slice(2, 8);
  return `placed-${Date.now().toString(36)}-${suffix}-${asset.replace(/[^a-z0-9]+/gi, '-')}`;
}

function applyObjectMetadata(model, record, type) {
  const scale = normalizeNumber(record.scale, 1);
  model.userData.category = record.category || 'default';
  model.userData.originalY = normalizeNumber(record.y);
  model.userData.originalScale = scale;
  model.userData.currentScale = scale;
  model.userData.currentY = normalizeNumber(record.y);
  model.userData.assetFile = record.asset;
  model.userData.editorId = record.id;
  model.userData.editorType = type;
  model.userData.isEditable = true;
}

function applyTransform(model, record) {
  const scale = normalizeNumber(record.scale, 1);
  model.position.set(
    normalizeNumber(record.x),
    normalizeNumber(record.y),
    normalizeNumber(record.z)
  );
  model.scale.setScalar(scale);
  model.rotation.y = normalizeNumber(record.rotY);
  applyObjectMetadata(model, record, record.type || 'placed');
}

function createBaseRecord(config, savedRecord = null) {
  return {
    id: config.id,
    type: 'base',
    asset: config.asset,
    x: normalizeNumber(savedRecord?.x, config.pos[0]),
    y: normalizeNumber(savedRecord?.y, config.pos[1]),
    z: normalizeNumber(savedRecord?.z, config.pos[2]),
    scale: normalizeNumber(savedRecord?.scale, config.scale),
    rotY: normalizeNumber(savedRecord?.rotY, 0),
    category: savedRecord?.category || config.category,
    deleted: false
  };
}

function restoreSavedObjects() {
  editorState.objects
    .filter((record) => record.type === 'placed' && !record.deleted && record.asset)
    .forEach((record) => {
      loader.load('./' + record.asset, (gltf) => {
        const model = gltf.scene;
        applyTransform(model, record);
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        scene.add(model);
        interactiveObjects.push(model);
      });
    });
}

// Mouse interaction
function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function onClick(event) {
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(interactiveObjects, true);
  
  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && !obj.userData.category) {
      obj = obj.parent;
    }
    
    if (obj.userData.category) {
      selectObject(obj);
    }
  } else {
    deselectObject();
  }
}

function selectObject(obj) {
  // Deselect previous
  if (selectedObject && selectedObject !== obj) {
    const prev = selectedObject;
    animateScale(prev, prev.userData.currentScale);
    animateY(prev, prev.userData.currentY);
  }
  selectedObject = obj;
  const category = obj.userData.category;
  const info = objectInfo[category] || objectInfo.default;
  // Animate selection (relative to current state)
  animateScale(obj, obj.userData.currentScale * 1.2);
  animateY(obj, obj.userData.currentY + 1);
  // Show info panel
  document.getElementById('info-title').textContent = info.title;
  document.getElementById('info-text').textContent = info.text;
  document.getElementById('info-panel').classList.add('visible');
  
  // Create particle burst
  createParticleBurst(obj.position);
}

function deselectObject() {
  if (selectedObject) {
    animateScale(selectedObject, selectedObject.userData.currentScale);
    animateY(selectedObject, selectedObject.userData.currentY);
    selectedObject = null;
  }
  document.getElementById('info-panel').classList.remove('visible');
}

function animateScale(obj, targetScale) {
  const startScale = obj.scale.x;
  const startTime = Date.now();
  const duration = 300;
  
  function update() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const newScale = startScale + (targetScale - startScale) * eased;
    obj.scale.setScalar(newScale);
    if (progress < 1) requestAnimationFrame(update);
  }
  update();
}

function animateY(obj, targetY) {
  const startY = obj.position.y;
  const startTime = Date.now();
  const duration = 400;
  
  function update() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    obj.position.y = startY + (targetY - startY) * eased;
    if (progress < 1) requestAnimationFrame(update);
  }
  update();
}

function createParticleBurst(position) {
  const particleCount = 20;
  const particles = [];
  
  for (let i = 0; i < particleCount; i++) {
    const geometry = new THREE.SphereGeometry(0.1, 8, 8);
    const material = new THREE.MeshBasicMaterial({ 
      color: new THREE.Color().setHSL(0.9 + Math.random() * 0.1, 0.8, 0.6),
      transparent: true,
      opacity: 1
    });
    const particle = new THREE.Mesh(geometry, material);
    particle.position.copy(position);
    particle.position.y += 2;
    particle.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 0.3,
      Math.random() * 0.2 + 0.1,
      (Math.random() - 0.5) * 0.3
    );
    particle.userData.life = 1;
    scene.add(particle);
    particles.push(particle);
  }
  
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.position.add(p.userData.velocity);
      p.userData.velocity.y -= 0.01;
      p.userData.life -= 0.02;
      p.material.opacity = p.userData.life;
      
      if (p.userData.life <= 0) {
        scene.remove(p);
        particles.splice(i, 1);
      }
    }
    if (particles.length > 0) requestAnimationFrame(updateParticles);
  }
  updateParticles();
}

// Hover effect
function updateHover() {
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(interactiveObjects, true);
  
  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && !obj.userData.category) {
      obj = obj.parent;
    }
    
    if (obj.userData.category && obj !== selectedObject) {
      if (hoveredObject !== obj) {
        if (hoveredObject && hoveredObject !== selectedObject) {
          animateScale(hoveredObject, hoveredObject.userData.currentScale);
        }
        hoveredObject = obj;
        animateScale(obj, obj.userData.currentScale * 1.05);
        document.body.style.cursor = 'pointer';
      }
    }
  } else {
    if (hoveredObject && hoveredObject !== selectedObject) {
      animateScale(hoveredObject, hoveredObject.userData.currentScale);
    }
    hoveredObject = null;
    document.body.style.cursor = 'default';
  }
}

// Animation loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const time = clock.getElapsedTime();
  
  // Animate shader surfaces
  waterUniforms.uTime.value = time;
  smokeClouds.forEach((cloud, index) => {
    cloud.material.uniforms.uTime.value = time;
    cloud.position.x = cloud.userData.baseX + Math.sin(time * 0.18 + index) * 1.1;
    cloud.position.y = cloud.userData.baseY + Math.cos(time * 0.13 + index) * 0.25;
    cloud.lookAt(camera.position);
  });
  
  // Sun orbit
  if (sunMesh) {
    sunAngle += 0.003;
    sunMesh.position.x = Math.cos(sunAngle) * 50;
    sunMesh.position.z = Math.sin(sunAngle) * 50;
    sunMesh.position.y = 30 + Math.sin(sunAngle) * 5;
  }
  
  // Update hover effects
  updateHover();
  controls.update();
  renderer.render(scene, camera);
}

// Hide loading after timeout even if models fail
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 8000);

// ═══════════════════════════════════════════
// EDIT MODE
// ═══════════════════════════════════════════
let editMode = false;
let editSelectedObj = null;
const editBtn = document.getElementById('edit-toggle');
const editPanel = document.getElementById('edit-panel');
const edAsset = document.getElementById('ed-asset');
const edScale = document.getElementById('ed-scale');
const edRot = document.getElementById('ed-rot');
const edX = document.getElementById('ed-x');
const edZ = document.getElementById('ed-z');
const edScaleVal = document.getElementById('ed-scale-val');
const edRotVal = document.getElementById('ed-rot-val');
const edXVal = document.getElementById('ed-x-val');
const edZVal = document.getElementById('ed-z-val');

// ─── Passcode Keypad ──────────────────────
const PASSCODE = '8956';
let keypadInput = '';
const keypadOverlay = document.getElementById('keypad-overlay');
const keypadDisplay = document.getElementById('keypad-display');
const keypadGrid = document.getElementById('keypad-grid');

// Build keypad buttons
[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].forEach(k => {
  const btn = document.createElement('button');
  btn.textContent = k;
  btn.className = 'keypad-key';
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (k === 'C') { keypadInput = ''; }
    else if (k === '⌫') { keypadInput = keypadInput.slice(0, -1); }
    else if (keypadInput.length < PASSCODE.length) { keypadInput += k; }
    keypadDisplay.textContent = keypadInput.replace(/./g, '•').padEnd(PASSCODE.length, ' ');
    if (keypadInput === PASSCODE) {
      keypadOverlay.style.display = 'none';
      keypadInput = '';
      enableEditMode();
    }
  });
  keypadGrid.appendChild(btn);
});

function showKeypad() {
  keypadInput = '';
  keypadDisplay.textContent = '';
  keypadOverlay.style.display = 'flex';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && keypadOverlay.style.display === 'flex') {
    keypadOverlay.style.display = 'none';
  }
});

// ─── Editor Mode ──────────────────────────
function enableEditMode() {
  deselectObject();
  if (hoveredObject) {
    animateScale(hoveredObject, hoveredObject.userData.currentScale);
    hoveredObject = null;
  }
  editMode = true;
  editBtn.classList.add('active');
  editPanel.classList.add('visible');
  document.body.style.cursor = 'default';
}
function disableEditMode() {
  editMode = false;
  editBtn.classList.remove('active');
  editPanel.classList.remove('visible');
  deselectEditObject();
  controls.enabled = true;
}

// All available GLB assets
const allAssets = [
  'bamboo-1.glb','bamboo-2.glb','big-sakura-bonsai.glb',
  'bonbori-clVUEgVMIiX.glb','bonbori-dcnV-eqevIB.glb',
  'castle-gate.glb','cherry-tree.glb','japanese-room.glb',
  'japanese-stone-lamp.glb','japanese-torii.glb','koi-fish.glb',
  'mount-fuji.glb','pagoda-1.glb','pagoda-2.glb','pagoda-3.glb',
  'post-lantern.glb','red-lantern.glb','sakura-tree.glb',
  'shrine-a68qNnAC4m-.glb','shrine-tFxdxO5clk.glb',
  'stonepath-5BPCPOycxC.glb','stonepath-gYhoEOKItJ.glb',
  'temple-1.glb','temple-2.glb','temple-3.glb',
  'torii-gate-1.glb','torii-gate-2.glb','wooden-fortress-gate.glb'
];
allAssets.forEach(a => {
  const opt = document.createElement('option');
  opt.value = a;
  opt.textContent = a.replace('.glb','').replace(/-/g,' ');
  edAsset.appendChild(opt);
});

// Slider value displays
edScale.addEventListener('input', () => { edScaleVal.textContent = parseFloat(edScale.value).toFixed(1); });
edRot.addEventListener('input', () => { edRotVal.textContent = edRot.value + '°'; });
edX.addEventListener('input', () => { edXVal.textContent = parseFloat(edX.value).toFixed(1); });
edZ.addEventListener('input', () => { edZVal.textContent = parseFloat(edZ.value).toFixed(1); });

// Toggle edit mode
editBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (editMode) {
    disableEditMode();
  } else {
    showKeypad();
  }
});
editPanel.addEventListener('click', (e) => e.stopPropagation());

// Place object
document.getElementById('ed-place').addEventListener('click', (e) => {
  e.stopPropagation();
  const url = './' + edAsset.value;
  const scale = parseFloat(edScale.value);
  const rotY = THREE.MathUtils.degToRad(parseFloat(edRot.value));
  const posX = parseFloat(edX.value);
  const posZ = parseFloat(edZ.value);

  loader.load(url, (gltf) => {
    const model = gltf.scene;
    applyTransform(model, {
      id: createPlacedId(edAsset.value),
      type: 'placed',
      asset: edAsset.value,
      x: posX,
      y: 0,
      z: posZ,
      scale,
      rotY,
      category: 'edit-placed',
      deleted: false
    });
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    scene.add(model);
    interactiveObjects.push(model);
    saveAllObjects();
    selectEditObject(model);
  });
});

// Delete selected
document.getElementById('ed-delete').addEventListener('click', (e) => {
  e.stopPropagation();
  if (editSelectedObj) {
    const deletedRecord = serializeObject(editSelectedObj);
    deletedRecord.deleted = true;
    scene.remove(editSelectedObj);
    const idx = interactiveObjects.indexOf(editSelectedObj);
    if (idx > -1) interactiveObjects.splice(idx, 1);
    if (deletedRecord.type === 'base') {
      editorState.objects = editorState.objects.filter((record) => record.id !== deletedRecord.id);
      editorState.objects.push(deletedRecord);
    }
    saveAllObjects();
    deselectEditObject();
  }
});

function selectEditObject(obj) {
  deselectEditObject();
  editSelectedObj = obj;
  controls.enabled = false;
  // Update sliders to match object
  edScale.value = obj.scale.x;
  edScaleVal.textContent = obj.scale.x.toFixed(1);
  const rotDeg = THREE.MathUtils.radToDeg(obj.rotation.y);
  edRot.value = Math.round(rotDeg);
  edRotVal.textContent = Math.round(rotDeg) + '°';
  edX.value = obj.position.x;
  edXVal.textContent = obj.position.x.toFixed(1);
  edZ.value = obj.position.z;
  edZVal.textContent = obj.position.z.toFixed(1);
}

function deselectEditObject() {
  editSelectedObj = null;
  controls.enabled = true;
}

// When in edit mode, click on ground to place at XZ, click on editable to select
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const intersectionPoint = new THREE.Vector3();

// Override onClick for edit mode
const origOnClick = onClick;
window.removeEventListener('click', onClick);
window.addEventListener('click', (event) => {
  if (!editMode) { origOnClick(event); return; }

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check if clicking an editable object
  const hits = raycaster.intersectObjects(interactiveObjects, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !obj.userData.category) obj = obj.parent;
    if (obj?.userData?.isEditable) { selectEditObject(obj); return; }
  }

  // Otherwise, place on ground at click position
  if (raycaster.ray.intersectPlane(groundPlane, intersectionPoint)) {
    edX.value = Math.max(-40, Math.min(40, intersectionPoint.x));
    edXVal.textContent = parseFloat(edX.value).toFixed(1);
    edZ.value = Math.max(-40, Math.min(40, intersectionPoint.z));
    edZVal.textContent = parseFloat(edZ.value).toFixed(1);
  }
});

// Live-update selected object when sliders change
edScale.addEventListener('input', () => {
  if (editSelectedObj) {
    const s = parseFloat(edScale.value);
    editSelectedObj.scale.setScalar(s);
    editSelectedObj.userData.currentScale = s;
    saveAllObjects();
  }
});
edRot.addEventListener('input', () => {
  if (editSelectedObj) { editSelectedObj.rotation.y = THREE.MathUtils.degToRad(parseFloat(edRot.value)); saveAllObjects(); }
});
edX.addEventListener('input', () => {
  if (editSelectedObj) { editSelectedObj.position.x = parseFloat(edX.value); saveAllObjects(); }
});
edZ.addEventListener('input', () => {
  if (editSelectedObj) { editSelectedObj.position.z = parseFloat(edZ.value); saveAllObjects(); }
});
</script>

</body>
</html>
