  #loading {

  /* Edit Mode */
  #edit-toggle {

  #edit-panel .val {

  }
  #edit-panel button {
    margin-top: 10px;
    width: 100%;

    border: 1px solid rgba(45,90,45,0.3);
    background: rgba(45,90,45,0.08);
    color: #2d5a2d;

    transition: background 0.2s;

  #edit-panel button:hover { background: rgba(45,90,45,0.18); }
  #edit-panel button.danger {

    border-color: rgba(201,42,42,0.3);
    background: rgba(201,42,42,0.06);
  }
  #edit-panel button.danger:hover { background: rgba(201,42,42,0.15); }
  .edit-selected-outline {
    outline: 2px solid #ff6b6b;

  /* Particle effects */
  .sakura-petal {
    position: fixed;
    width: 12px;
    height: 12px;
    background: radial-gradient(ellipse at center, #ffb4c8 0%, #ff8fab 50%, transparent 70%);
    border-radius: 50% 0 50% 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    animation: fall linear forwards;
  }
  
  @keyframes fall {
    0% {
      opacity: 0;
      transform: translateY(-20px) rotate(0deg);
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.6;
    }

      opacity: 0;
      transform: translateY(100vh) rotate(720deg);
    }
  }
</style>

<script type="importmap">
{

    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Scene setup - Totoro-style bright daytime
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Bright blue sky
scene.fog = new THREE.Fog(0x87ceeb, 80, 200); // Light distance fog

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 15, 35);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 10;
controls.maxDistance = 80;
controls.target.set(0, 2, 0);

// Lighting - bright daylight
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff4e0, 1.8);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
scene.add(sunLight);

// Soft fill light
const fillLight = new THREE.DirectionalLight(0x87ceeb, 0.4);
fillLight.position.set(-20, 20, -10);
scene.add(fillLight);

// Ground - lush green grass
const groundGeometry = new THREE.CircleGeometry(60, 64);
const groundMaterial = new THREE.MeshStandardMaterial({ 
  color: 0x4a8f3a,
  roughness: 0.85,
  metalness: 0.0
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Water pond
const waterGeometry = new THREE.CircleGeometry(8, 32);
const waterMaterial = new THREE.MeshStandardMaterial({
  color: 0x4a9fd4,
  roughness: 0.2,
  metalness: 0.3,
  transparent: true,
  opacity: 0.7
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.set(-8, 0.05, 8);
scene.add(water);

// Sun
let sunAngle = 0;
const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
sunMesh.position.set(50, 30, 0);
scene.add(sunMesh);

// Interactive objects tracking
const interactiveObjects = [];
const objectInfo = {
  'torii': { title: '鳥居 Torii', text: 'Sacred gate marking the transition from mundane to sacred space. Common at Shinto shrines.' },
  'pagoda': { title: '塔 Pagoda', text: 'Multi-tiered tower originating from Buddhist stupas. Each level represents a element.' },
  'temple': { title: '寺 Temple', text: 'Place of worship and meditation. Architecture blends Japanese and Buddhist styles.' },
  'shrine': { title: '神社 Shrine', text: 'Shinto place of worship. Home to kami (spirits) and sacred objects.' },
  'cherry': { title: '桜 Cherry Blossom', text: 'Sakura symbolizes the transient nature of life. Celebrated during hanami season.' },
  'bamboo': { title: '竹 Bamboo', text: 'Symbol of strength and flexibility. Used in architecture, art, and daily life.' },
  'lantern': { title: '灯籠 Lantern', text: 'Traditional lighting element. Stone lanterns guide paths in gardens and temples.' },
  'fuji': { title: '富士山 Mount Fuji', text: 'Japan\'s sacred mountain. Active volcano and symbol of beauty and endurance.' },
  'koi': { title: '鯉 Koi', text: 'Colorful carp symbolizing perseverance, strength, and good fortune.' },
  'gate': { title: '門 Gate', text: 'Castle and fortress gates. Architectural marvels of feudal Japan.' },
  'default': { title: 'Voxel Object', text: 'A piece of this peaceful voxel world.' }
};

// Raycaster for interaction
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredObject = null;
let selectedObject = null;

// Load models
const loader = new GLTFLoader();

const models = [
  { url: './japanese-torii.glb', pos: [0, 0, -12], scale: 2, category: 'torii' },
  { url: './torii-gate-1.glb', pos: [15, 0, -8], scale: 1.5, category: 'torii' },
  { url: './torii-gate-2.glb', pos: [-18, 0, -5], scale: 1.8, category: 'torii' },
  { url: './pagoda-1.glb', pos: [12, 0, 10], scale: 1.5, category: 'pagoda' },
  { url: './pagoda-2.glb', pos: [-15, 0, 12], scale: 2, category: 'pagoda' },
  { url: './pagoda-3.glb', pos: [20, 0, -15], scale: 1.8, category: 'pagoda' },
  { url: './temple-1.glb', pos: [-8, 0, -18], scale: 2, category: 'temple' },
  { url: './temple-2.glb', pos: [8, 0, 18], scale: 1.5, category: 'temple' },
  { url: './temple-3.glb', pos: [-20, 0, 0], scale: 1.8, category: 'temple' },
  { url: './shrine-a68qNnAC4m-.glb', pos: [5, 0, -20], scale: 2, category: 'shrine' },
  { url: './shrine-tFxdxO5clk.glb', pos: [-12, 0, 15], scale: 1.5, category: 'shrine' },
  { url: './cherry-tree.glb', pos: [-5, 0, 5], scale: 1.5, category: 'cherry' },
  { url: './big-sakura-bonsai.glb', pos: [10, 0, 3], scale: 1.2, category: 'cherry' },
  { url: './sakura-tree.glb', pos: [-18, 0, -12], scale: 1.8, category: 'cherry' },
  { url: './bamboo-1.glb', pos: [18, 0, 5], scale: 1.5, category: 'bamboo' },
  { url: './bamboo-2.glb', pos: [-22, 0, 8], scale: 2, category: 'bamboo' },
  { url: './mount-fuji.glb', pos: [0, 0, 25], scale: 3, category: 'fuji' },
  { url: './red-lantern.glb', pos: [3, 2, -8], scale: 1.2, category: 'lantern' },
  { url: './post-lantern.glb', pos: [-3, 0, -10], scale: 1.5, category: 'lantern' },
  { url: './bonbori-clVUEgVMIiX.glb', pos: [8, 0, -5], scale: 1, category: 'lantern' },
  { url: './bonbori-dcnV-eqevIB.glb', pos: [-10, 0, -3], scale: 1.2, category: 'lantern' },
  { url: './japanese-stone-lamp.glb', pos: [15, 0, 0], scale: 1.5, category: 'lantern' },
  { url: './koi-fish.glb', pos: [-8, 0.3, 8], scale: 1, category: 'koi' },
  { url: './castle-gate.glb', pos: [22, 0, -20], scale: 2, category: 'gate' },
  { url: './wooden-fortress-gate.glb', pos: [-25, 0, -18], scale: 1.8, category: 'gate' },
  { url: './japanese-room.glb', pos: [0, 0, 0], scale: 1.5, category: 'temple' },
  { url: './stonepath-5BPCPOycxC.glb', pos: [6, 0, 12], scale: 1.5, category: 'default' },
  { url: './stonepath-gYhoEOKItJ.glb', pos: [-6, 0, 14], scale: 1.5, category: 'default' },
];

let loadedCount = 0;
const totalModels = models.length;

function updateLoading() {
  loadedCount++;
  if (loadedCount >= totalModels) {
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 500);
  }
}

console.log(`Starting to load ${models.length} models...`);

models.forEach((config, index) => {
  console.log(`[${index + 1}/${models.length}] Loading: ${config.url}`);
  
  loader.load(
    config.url,
    (gltf) => {
      console.log(`✓ Loaded: ${config.url}`);
      const model = gltf.scene;
      model.position.set(...config.pos);
      model.scale.setScalar(config.scale);
      model.userData.category = config.category;
      model.userData.originalY = config.pos[1];
      model.userData.originalScale = config.scale;
      model.userData.currentScale = config.scale;
      model.userData.currentY = config.pos[1];
      
      // Enable shadows
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      
      scene.add(model);
      interactiveObjects.push(model);
      console.log(`  Added to scene. Total objects: ${interactiveObjects.length}`);
      updateLoading();
    },
    (progress) => {
      if (progress.lengthComputable) {
        const percent = (progress.loaded / progress.total * 100).toFixed(1);
        console.log(`  Progress: ${percent}%`);
      }
    },
    (error) => {
      console.error(`✗ Failed to load ${config.url}:`, error);
      updateLoading();
    }
  );
});

// Fallback if models don't load - create simple voxel placeholders
setTimeout(() => {
  if (loadedCount < totalModels / 2) {
    console.log('Creating fallback voxel objects...');
    createFallbackScene();
  }
}, 5000);

function createFallbackScene() {
  const colors = [0xff6b6b, 0xffd93d, 0x6bcf7f, 0x4d96ff, 0xff6bcb];
  
  models.forEach((config, i) => {
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const material = new THREE.MeshStandardMaterial({ 
      color: colors[i % colors.length],
      roughness: 0.7,
      metalness: 0.3
    });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(...config.pos);
    cube.position.y = 1;
    cube.scale.setScalar(config.scale);
    cube.castShadow = true;
    cube.receiveShadow = true;
    cube.userData.category = config.category;
    cube.userData.originalY = 1;
    cube.userData.originalScale = config.scale;
    cube.userData.currentScale = config.scale;
    cube.userData.currentY = 1;
    scene.add(cube);
    interactiveObjects.push(cube);
  });
  
  document.getElementById('loading').classList.add('hidden');
}

// Sakura petals
function createSakuraPetal() {
  const petal = document.createElement('div');
  petal.className = 'sakura-petal';
  petal.style.left = Math.random() * 100 + '%';
  petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
  petal.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(petal);
  
  setTimeout(() => petal.remove(), 15000);
}

setInterval(createSakuraPetal, 800);

// Mouse interaction
function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function onClick(event) {
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(interactiveObjects, true);
  
  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && !obj.userData.category) {
      obj = obj.parent;
    }
    
    if (obj.userData.category) {
      selectObject(obj);
    }
  } else {
    deselectObject();
  }
}

function selectObject(obj) {
  // Deselect previous
  if (selectedObject && selectedObject !== obj) {
    const prev = selectedObject;
    animateScale(prev, prev.userData.currentScale);
    animateY(prev, prev.userData.currentY);
  }
  selectedObject = obj;
  const category = obj.userData.category;
  const info = objectInfo[category] || objectInfo.default;
  // Animate selection (relative to current state)
  animateScale(obj, obj.userData.currentScale * 1.2);
  animateY(obj, obj.userData.currentY + 1);
  // Show info panel
  document.getElementById('info-title').textContent = info.title;
  document.getElementById('info-text').textContent = info.text;
  document.getElementById('info-panel').classList.add('visible');
  
  // Create particle burst
  createParticleBurst(obj.position);
}

function deselectObject() {
  if (selectedObject) {
    animateScale(selectedObject, selectedObject.userData.currentScale);
    animateY(selectedObject, selectedObject.userData.currentY);
    selectedObject = null;
  }
  document.getElementById('info-panel').classList.remove('visible');
}

function animateScale(obj, targetScale) {
  const startScale = obj.scale.x;
  const startTime = Date.now();
  const duration = 300;
  
  function update() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const newScale = startScale + (targetScale - startScale) * eased;
    obj.scale.setScalar(newScale);
    if (progress < 1) requestAnimationFrame(update);
  }
  update();
}

function animateY(obj, targetY) {
  const startY = obj.position.y;
  const startTime = Date.now();
  const duration = 400;
  
  function update() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    obj.position.y = startY + (targetY - startY) * eased;
    if (progress < 1) requestAnimationFrame(update);
  }
  update();
}

function createParticleBurst(position) {
  const particleCount = 20;
  const particles = [];
  
  for (let i = 0; i < particleCount; i++) {
    const geometry = new THREE.SphereGeometry(0.1, 8, 8);
    const material = new THREE.MeshBasicMaterial({ 
      color: new THREE.Color().setHSL(0.9 + Math.random() * 0.1, 0.8, 0.6),
      transparent: true,
      opacity: 1
    });
    const particle = new THREE.Mesh(geometry, material);
    particle.position.copy(position);
    particle.position.y += 2;
    particle.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 0.3,
      Math.random() * 0.2 + 0.1,
      (Math.random() - 0.5) * 0.3
    );
    particle.userData.life = 1;
    scene.add(particle);
    particles.push(particle);
  }
  
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.position.add(p.userData.velocity);
      p.userData.velocity.y -= 0.01;
      p.userData.life -= 0.02;
      p.material.opacity = p.userData.life;
      
      if (p.userData.life <= 0) {
        scene.remove(p);
        particles.splice(i, 1);
      }
    }
    if (particles.length > 0) requestAnimationFrame(updateParticles);
  }
  updateParticles();
}

// Hover effect
function updateHover() {
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(interactiveObjects, true);
  
  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && !obj.userData.category) {
      obj = obj.parent;
    }
    
    if (obj.userData.category && obj !== selectedObject) {
      if (hoveredObject !== obj) {
        if (hoveredObject && hoveredObject !== selectedObject) {
          animateScale(hoveredObject, hoveredObject.userData.currentScale);
        }
        hoveredObject = obj;
        animateScale(obj, obj.userData.currentScale * 1.05);
        document.body.style.cursor = 'pointer';
      }
    }
  } else {
    if (hoveredObject && hoveredObject !== selectedObject) {
      animateScale(hoveredObject, hoveredObject.userData.currentScale);
    }
    hoveredObject = null;
    document.body.style.cursor = 'default';
  }
}

// Animation loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const time = clock.getElapsedTime();
  
  // Animate water
  water.material.opacity = 0.6 + Math.sin(time * 2) * 0.1;
  
  // Sun orbit
  if (sunMesh) {
    sunAngle += 0.003;
    sunMesh.position.x = Math.cos(sunAngle) * 50;
    sunMesh.position.z = Math.sin(sunAngle) * 50;
    sunMesh.position.y = 30 + Math.sin(sunAngle) * 5;
  }
  
  // Update hover effects
  updateHover();
  controls.update();
  renderer.render(scene, camera);
}

// Event listeners
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('click', onClick);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start
animate();

// Hide loading after timeout even if models fail
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 8000);

// ═══════════════════════════════════════════
// EDIT MODE
// ═══════════════════════════════════════════
let editMode = false;
let editSelectedObj = null;
const editBtn = document.getElementById('edit-toggle');
const editPanel = document.getElementById('edit-panel');
const edAsset = document.getElementById('ed-asset');
const edScale = document.getElementById('ed-scale');
const edRot = document.getElementById('ed-rot');
const edX = document.getElementById('ed-x');
const edZ = document.getElementById('ed-z');
const edScaleVal = document.getElementById('ed-scale-val');
const edRotVal = document.getElementById('ed-rot-val');
const edXVal = document.getElementById('ed-x-val');
const edZVal = document.getElementById('ed-z-val');

// All available GLB assets
const allAssets = [
  'bamboo-1.glb','bamboo-2.glb','big-sakura-bonsai.glb',
  'bonbori-clVUEgVMIiX.glb','bonbori-dcnV-eqevIB.glb',
  'castle-gate.glb','cherry-tree.glb','japanese-room.glb',
  'japanese-stone-lamp.glb','japanese-torii.glb','koi-fish.glb',
  'mount-fuji.glb','pagoda-1.glb','pagoda-2.glb','pagoda-3.glb',
  'post-lantern.glb','red-lantern.glb','sakura-tree.glb',
  'shrine-a68qNnAC4m-.glb','shrine-tFxdxO5clk.glb',
  'stonepath-5BPCPOycxC.glb','stonepath-gYhoEOKItJ.glb',
  'temple-1.glb','temple-2.glb','temple-3.glb',
  'torii-gate-1.glb','torii-gate-2.glb','wooden-fortress-gate.glb'
];
allAssets.forEach(a => {
  const opt = document.createElement('option');
  opt.value = a;
  opt.textContent = a.replace('.glb','').replace(/-/g,' ');
  edAsset.appendChild(opt);
});

// Slider value displays
edScale.addEventListener('input', () => { edScaleVal.textContent = parseFloat(edScale.value).toFixed(1); });
edRot.addEventListener('input', () => { edRotVal.textContent = edRot.value + '°'; });
edX.addEventListener('input', () => { edXVal.textContent = parseFloat(edX.value).toFixed(1); });
edZ.addEventListener('input', () => { edZVal.textContent = parseFloat(edZ.value).toFixed(1); });

// Toggle edit mode
editBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  editMode = !editMode;
  editBtn.classList.toggle('active', editMode);
  editPanel.classList.toggle('visible', editMode);
  if (!editMode) {
    deselectEditObject();
    controls.enabled = true;
  }
});

// Place object
document.getElementById('ed-place').addEventListener('click', (e) => {
  e.stopPropagation();
  const url = './' + edAsset.value;
  const scale = parseFloat(edScale.value);
  const rotY = THREE.MathUtils.degToRad(parseFloat(edRot.value));
  const posX = parseFloat(edX.value);
  const posZ = parseFloat(edZ.value);

  loader.load(url, (gltf) => {
    const model = gltf.scene;
    model.position.set(posX, 0, posZ);
    model.scale.setScalar(scale);
    model.rotation.y = rotY;
    model.userData.category = 'edit-placed';
    model.userData.originalY = 0;
    model.userData.originalScale = scale;
    model.userData.isEditable = true;
    model.userData.currentScale = scale;
    model.userData.currentY = 0;
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    scene.add(model);
    interactiveObjects.push(model);
    selectEditObject(model);
  });
});

// Delete selected
document.getElementById('ed-delete').addEventListener('click', (e) => {
  e.stopPropagation();
  if (editSelectedObj) {
    scene.remove(editSelectedObj);
    const idx = interactiveObjects.indexOf(editSelectedObj);
    if (idx > -1) interactiveObjects.splice(idx, 1);
    deselectEditObject();
  }
});

function selectEditObject(obj) {
  deselectEditObject();
  editSelectedObj = obj;
  controls.enabled = false;
  // Update sliders to match object
  edScale.value = obj.scale.x;
  edScaleVal.textContent = obj.scale.x.toFixed(1);
  const rotDeg = THREE.MathUtils.radToDeg(obj.rotation.y);
  edRot.value = Math.round(rotDeg);
  edRotVal.textContent = Math.round(rotDeg) + '°';
  edX.value = obj.position.x;
  edXVal.textContent = obj.position.x.toFixed(1);
  edZ.value = obj.position.z;
  edZVal.textContent = obj.position.z.toFixed(1);
}

function deselectEditObject() {
  editSelectedObj = null;
  controls.enabled = true;
}

// When in edit mode, click on ground to place at XZ, click on editable to select
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const intersectionPoint = new THREE.Vector3();

// Override onClick for edit mode
const origOnClick = onClick;
window.removeEventListener('click', onClick);
window.addEventListener('click', (event) => {
  if (!editMode) { origOnClick(event); return; }

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check if clicking an editable object
  const hits = raycaster.intersectObjects(interactiveObjects, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !obj.userData.category) obj = obj.parent;
    if (obj) { selectEditObject(obj); return; }
  }

  // Otherwise, place on ground at click position
  if (raycaster.ray.intersectPlane(groundPlane, intersectionPoint)) {
    edX.value = Math.max(-40, Math.min(40, intersectionPoint.x));
    edXVal.textContent = parseFloat(edX.value).toFixed(1);
    edZ.value = Math.max(-40, Math.min(40, intersectionPoint.z));
    edZVal.textContent = parseFloat(edZ.value).toFixed(1);
  }
});

// Live-update selected object when sliders change
edScale.addEventListener('input', () => {
  if (editSelectedObj) {
    const s = parseFloat(edScale.value);
    editSelectedObj.scale.setScalar(s);
    editSelectedObj.userData.currentScale = s;
  }
});
edRot.addEventListener('input', () => {
  if (editSelectedObj) editSelectedObj.rotation.y = THREE.MathUtils.degToRad(parseFloat(edRot.value));
});
edX.addEventListener('input', () => {
  if (editSelectedObj) editSelectedObj.position.x = parseFloat(edX.value);
});
edZ.addEventListener('input', () => {
  if (editSelectedObj) editSelectedObj.position.z = parseFloat(edZ.value);
});
</script>
