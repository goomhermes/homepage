<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ Fit Puzzles</title>
<style>
:root {
  --bg: #f5f7fa;
  --card-bg: #ffffff;
  --primary: #2c3e50;
  --accent: #3498db;
  --accent-hover: #2980b9;
  --text: #333333;
  --text-muted: #777777;
  --border: #e0e0e0;
  --shadow: 0 4px 12px rgba(0,0,0,0.1);
  --shadow-hover: 0 8px 24px rgba(0,0,0,0.15);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  background: var(--primary);
  color: white;
  padding: 1.5rem 1rem;
  text-align: center;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 { font-size: 1.75rem; font-weight: 700; }
header p { font-size: 0.95rem; opacity: 0.85; margin-top: 0.25rem; }
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
.filters {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
  justify-content: center; margin-bottom: 1.5rem;
}
.filter-btn {
  padding: 0.5rem 1.25rem;
  border: 2px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  border-radius: 999px; cursor: pointer;
  font-size: 0.9rem; font-weight: 600;
  transition: all 0.2s ease;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active {
  background: var(--accent); color: white;
  border-color: var(--accent);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.card svg { width: 100%; height: auto; display: block; }
.card-info {
  padding: 0.75rem; text-align: center;
}
.card-info .num { font-size: 1rem; font-weight: 700; color: var(--primary); }
.card-info .level {
  font-size: 0.75rem; color: var(--text-muted);
  text-transform: uppercase; margin-top: 0.15rem;
}
.level-starter .level { color: #8bc34a; }
.level-junior .level { color: #ff9800; }
.level-expert .level { color: #f44336; }
.level-master .level { color: #9c27b0; }
.level-wizard .level { color: #3f51b5; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 1rem;
  opacity: 0; transition: opacity 0.3s ease;
}
.modal-overlay.open { display: flex; opacity: 1; }
.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  max-width: 900px; width: 100%; max-height: 95vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  transform: scale(0.95); transition: transform 0.3s ease;
}
.modal-overlay.open .modal { transform: scale(1); }
.modal-header {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 1.25rem; font-weight: 700; }
.modal-close {
  background: none; border: none; font-size: 1.5rem;
  cursor: pointer; color: var(--text-muted);
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-body {
  padding: 1.5rem; display: flex; flex-direction: column;
  align-items: center; gap: 1rem;
}
.puzzle-view {
  position: relative; width: 100%; max-width: 640px;
}
.puzzle-view svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.solution-overlay {
  position: absolute; top: 0; left: 0; width: 100%;
  opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
}
.solution-overlay.show { opacity: 1; pointer-events: auto; }
.solution-overlay:not(.show) rect[data-r] { pointer-events: none !important; }
.controls {
  display: flex; flex-wrap: wrap; gap: 0.75rem;
  justify-content: center; align-items: center; width: 100%;
}
.btn {
  padding: 0.6rem 1.4rem; border: none; border-radius: 8px;
  font-size: 0.95rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s ease;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: var(--bg); color: var(--text); }
.btn-ghost:hover { background: var(--border); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Editor mode */
.editor-bar { text-align:center; margin-bottom:1rem; display:flex; gap:0.5rem; justify-content:center; align-items:center; flex-wrap:wrap; }
.edit-toggle.on { border-color:#e74c3c; color:#e74c3c; }
.mode-3d-toggle.on { border-color:#008f88; color:#00736d; background:#e9fffc; }
.board-3d-host {
  width:100%; aspect-ratio:1.9; overflow:hidden;
  background:#e7edf2; position:relative;
}
.board-3d-host::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,0.08);
}
.board-3d-thumb { width:100%; height:100%; display:block; object-fit:cover; }
#board3DContainer {
  display:none; width:100%; aspect-ratio:1.75; min-height:280px;
  background:#e7edf2; border-radius:8px; overflow:hidden;
  cursor:grab; touch-action:none;
}
#board3DContainer.dragging { cursor:grabbing; }
#board3DContainer canvas { width:100%; height:100%; display:block; }
body.mode-3d #board3DContainer { display:block; }
body.mode-3d #puzzleSvgContainer,
body.mode-3d #solutionSvgContainer { display:none; }
#confirmOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:500; align-items:center; justify-content:center; }
.confirm-box { background:#fff; border-radius:12px; padding:24px; max-width:380px; text-align:center; margin:0 16px; }
.confirm-title { font-weight:700; margin-bottom:8px; font-size:16px; }
.confirm-msg { margin-bottom:12px; font-size:14px; color:#555; }
.confirm-swatch { width:48px; height:48px; border-radius:10px; margin:0 auto 16px; border:2px solid #ddd; display:inline-block; vertical-align:middle; }
.confirm-actions { display:flex; gap:8px; justify-content:center; }
@keyframes sel-blink { 0%,100% { opacity:1; } 50% { opacity:0.15; } }
.cell-selected { animation:sel-blink 0.6s ease-in-out infinite; }
body.editor-active .puzzle-view { outline:2px dashed #e74c3c; outline-offset:3px; border-radius:8px; }
body.editor-active .puzzle-view svg { cursor:crosshair; }

/* Editor palette inside modal */
.editor-palette { display:none; width:100%; margin:0.75rem auto 0; max-width:400px; background:var(--bg); border-radius:8px; padding:8px; border:1px solid var(--border); }
body.editor-active .modal-overlay.open .editor-palette { display:block; }
.palette-wrap { display:flex; gap:5px; justify-content:center; flex-wrap:wrap; }
.palette-swatch { width:38px; height:38px; border-radius:6px; border:3px solid transparent; cursor:pointer; position:relative; transition:all 0.15s; display:flex; align-items:center; justify-content:center; }
.palette-swatch:hover { transform:scale(1.2); z-index:2; border-color:#555 !important; }
.palette-swatch.active { border-color:#ffeb3b !important; border-width:3px; box-shadow:0 0 8px rgba(255,235,59,0.6); }
.palette-swatch .idx { font-size:10px; font-weight:800; color:#333; text-shadow:0 0 3px #fff,0 0 3px #fff; pointer-events:none; }
.empty-swatch { border:2px solid #888; background:#e0e0e0; }
.palette-hint { font-size:11px; color:var(--text-muted); margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:4px; }

@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; }
  .modal-header { padding: 0.75rem 1rem; }
  .modal-body { padding: 1rem; }
  #board3DContainer { min-height:190px; aspect-ratio:1.55; }
  .controls { gap:0.4rem; }
  .controls .btn { padding:0.55rem 0.75rem; font-size:0.88rem; }
}
</style>
</head>
<body>
<header>
  <h1>IQ Fit Puzzles</h1>
  <p>120 challenges &ndash; 10 distinct piece colors (Pink, Red, Cyan, Orange, Green, Yellow, Purple, Navy, Light Blue, Light Green) &ndash; tap a puzzle, solve it, then reveal the answer</p>
</header>

<div class="container">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-level="all">All</button>
    <button class="filter-btn" data-level="starter">Starter</button>
    <button class="filter-btn" data-level="junior">Junior</button>
    <button class="filter-btn" data-level="expert">Expert</button>
    <button class="filter-btn" data-level="master">Master</button>
    <button class="filter-btn" data-level="wizard">Wizard</button>
  </div>
  <div class="editor-bar" id="editorBar">
    <button class="btn btn-ghost edit-toggle" id="editToggle">Edit Mode: OFF</button>
    <button class="btn btn-ghost mode-3d-toggle" id="mode3DToggle">3D Mode: OFF</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">Confirm Edit</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-swatch" id="confirmSwatch"></div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Puzzle 1</div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="puzzle-view" id="puzzleView">
        <div id="puzzleSvgContainer"></div>
        <div id="solutionSvgContainer" class="solution-overlay"></div>
        <div id="board3DContainer" aria-label="Interactive 3D puzzle board" title="Drag to orbit. Right-drag to pan. Scroll to zoom."></div>
      </div>
      <div class="controls">
        <button class="btn btn-ghost" id="btnPrev">&larr; Prev</button>
        <button class="btn btn-primary" id="btnToggle">Show Solution</button>
        <button class="btn btn-ghost" id="btnNext">Next &rarr;</button>
      </div>
      <div class="editor-palette" id="editorPalette">
        <div class="palette-hint">Click to select. Shift+click for multi-select.</div>
        <div class="palette-wrap" id="paletteWrap"></div>
      </div>
    </div>
  </div>
</div>

function renderBoard(data, w, sels) {
  const cw = w / 10, ch = w / 10, h = ch * 5;
  const margin = cw * 0.25;  // extra space around board for ball overflow
  const viewW = w + 2 * margin;
  const viewH = h + 2 * margin;
  const pw = margin + cw * 0.09;
  const r = cw * 0.47;      // piece ball radius
  const r_empty = cw * 0.22; // empty cell radius
  const rr = cw * 0.12;      // empty inner shadow
  const connW = cw * 0.42;   // connection width

  let svg = '<svg viewBox="0 0 ' + viewW + ' ' + viewH + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect x="0" y="0" width="' + viewW + '" height="' + viewH + '" fill="' + BOARD_COLOR + '" rx="4"/>';

  // Group cells by piece ID for adjacency connections
  const pieces = {};
  for (let r2 = 0; r2 < 5; r2++) {
    for (let c2 = 0; c2 < 10; c2++) {
      const cell = data[r2][c2];
      if (cell.t === 'p') {
        const pid = cell.id;
        if (!pieces[pid]) pieces[pid] = [];
        pieces[pid].push({r: r2, c: c2});
      }
    }
  }

  // Draw connections between orthogonally-adjacent cells of the same piece
  for (const pid in pieces) {
    const color = PIECE_COLORS[parseInt(pid)];
    const cells = pieces[pid];
    const cellMap = {};
    for (let i = 0; i < cells.length; i++) cellMap[cells[i].r + ',' + cells[i].c] = true;

    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      const cx = pw + cell.c * cw + cw/2;
      const cy = pw + cell.r * ch + ch/2;

      // Right neighbour
      if (cellMap[cell.r + ',' + (cell.c + 1)]) {
        const cx2 = pw + (cell.c + 1) * cw + cw/2;
        svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx2 + '" y2="' + cy + '" stroke="' + color + '" stroke-width="' + connW + '" stroke-linecap="round"/>';
      }
      // Down neighbour
      if (cellMap[(cell.r + 1) + ',' + cell.c]) {
        const cy2 = pw + (cell.r + 1) * ch + ch/2;
        svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + cy2 + '" stroke="' + color + '" stroke-width="' + connW + '" stroke-linecap="round"/>';
      }
    }
  }

  // Draw circles (balls for pieces, holes for empties)
  for (let r2 = 0; r2 < 5; r2++) {
    for (let c2 = 0; c2 < 10; c2++) {
      const cell = data[r2][c2];
      const cx = pw + c2 * cw + cw/2;
      const cy = pw + r2 * ch + ch/2;
      if (cell.t === 'e') {
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r_empty + '" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>';
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="rgba(0,0,0,0.04)"/>';
      } else {
        const color = PIECE_COLORS[cell.id];
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '"/>';
        svg += '<circle cx="' + (cx - r*0.2) + '" cy="' + (cy - r*0.25) + '" r="' + r*0.4 + '" fill="rgba(255,255,255,0.3)"/>';
      }
    }
  }

  // Clickable overlays (editor mode, modal view only)
  if (w >= 600) {
    for (let r3 = 0; r3 < 5; r3++) {
      for (let c3 = 0; c3 < 10; c3++) {
        const bx = pw + c3 * cw;
        const by = pw + r3 * ch;
        svg += '<rect data-r="' + r3 + '" data-c="' + c3 + '" x="' + bx + '" y="' + by + '" width="' + cw + '" height="' + ch + '" fill="rgba(0,0,0,0)" pointer-events="all"/>';
      }
    }
  }

  // Selection highlights (editor mode)
  if (sels && sels.length > 0 && w >= 600) {
    for (var si = 0; si < sels.length; si++) {
      const sx = pw + sels[si].col * cw;
      const sy = pw + sels[si].row * ch;
      svg += '<rect class="cell-selected" x="' + sx + '" y="' + sy + '" width="' + cw + '" height="' + ch + '" fill="none" stroke="#ffeb3b" stroke-width="5" stroke-dasharray="8,5" pointer-events="none"/>';
      svg += '<rect x="' + (sx-2) + '" y="' + (sy-2) + '" width="' + (cw+4) + '" height="' + (ch+4) + '" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="2" stroke-dasharray="8,5" pointer-events="none"/>';
    }
  }

  svg += '</svg>';
  return svg;
}

function initThreeAssets() {
  if (!window.THREE || threeMaterials.board) return !!window.THREE;
  var boardColor3D = new THREE.Color(BOARD_COLOR).convertSRGBToLinear();
  threeMaterials.board = new THREE.MeshStandardMaterial({color:boardColor3D, roughness:0.4, metalness:0.02});
  threeMaterials.socket = new THREE.MeshStandardMaterial({color:0x05284f, roughness:0.82});
  threeMaterials.empty = new THREE.MeshStandardMaterial({color:0xf7fafc, roughness:0.76});
  threeMaterials.floor = new THREE.MeshStandardMaterial({color:0xdce4ea, roughness:1});
  for (var i = 0; i < PIECE_COLORS.length; i++) {
    var pieceColor3D = new THREE.Color(PIECE_COLORS[i]).convertSRGBToLinear();
    threeMaterials.pieces.push(new THREE.MeshPhongMaterial({
      color:pieceColor3D,
      specular:0x252525,
      shininess:22
    }));
  }
  return true;
}

function makeCylinderBetween(a, b, radius, material) {
  var direction = new THREE.Vector3().subVectors(b, a);
  var mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 1, 18), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.scale.y = direction.length();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  return mesh;
}

function buildBoard3D(data) {
  initThreeAssets();
  var root = new THREE.Group();

  var base = new THREE.Mesh(new THREE.BoxGeometry(10.75, 0.42, 5.75), threeMaterials.board);
  base.position.y = 0;
  base.receiveShadow = true;
  base.castShadow = true;
  root.add(base);

  var rimLong = new THREE.BoxGeometry(10.9, 0.24, 0.16);
  var rimShort = new THREE.BoxGeometry(0.16, 0.24, 5.9);
  [[rimLong,0,-2.88],[rimLong,0,2.88],[rimShort,-5.38,0],[rimShort,5.38,0]].forEach(function(item) {
    var rim = new THREE.Mesh(item[0], threeMaterials.board);
    rim.position.set(item[1], 0.29, item[2]);
    rim.castShadow = true;
    root.add(rim);
  });

  var socketGeometry = new THREE.CylinderGeometry(0.31, 0.25, 0.14, 24);
  var emptyGeometry = new THREE.CylinderGeometry(0.19, 0.16, 0.08, 24);
  var ballGeometry = new THREE.SphereGeometry(0.43, 24, 16);
  var footGeometry = new THREE.CylinderGeometry(0.24, 0.19, 0.28, 20);

  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 10; c++) {
      var x = c - 4.5;
      var z = r - 2;
      var socket = new THREE.Mesh(socketGeometry, threeMaterials.socket);
      socket.position.set(x, 0.27, z);
      socket.receiveShadow = true;
      root.add(socket);

      var cell = data[r][c];
      if (cell.t === 'e') {
        var empty = new THREE.Mesh(emptyGeometry, threeMaterials.empty);
        empty.position.set(x, 0.33, z);
        empty.receiveShadow = true;
        root.add(empty);
      }
    }
  }

  var pieces = {};
  for (var pr = 0; pr < 5; pr++) {
    for (var pc = 0; pc < 10; pc++) {
      var pieceCell = data[pr][pc];
      if (pieceCell.t !== 'p') continue;
      if (!pieces[pieceCell.id]) pieces[pieceCell.id] = [];
      pieces[pieceCell.id].push({r:pr, c:pc});
    }
  }

  Object.keys(pieces).forEach(function(pidText) {
    var pid = parseInt(pidText);
    var material = threeMaterials.pieces[pid];
    var cells = pieces[pidText];
    var occupied = {};
    cells.forEach(function(cell) { occupied[cell.r + ',' + cell.c] = true; });

    cells.forEach(function(cell) {
      var x = cell.c - 4.5;
      var z = cell.r - 2;
      var foot = new THREE.Mesh(footGeometry, material);
      foot.position.set(x, 0.4, z);
      foot.castShadow = true;
      root.add(foot);

      var ball = new THREE.Mesh(ballGeometry, material);
      ball.position.set(x, 0.61, z);
      ball.scale.y = 0.78;
      ball.castShadow = true;
      ball.receiveShadow = true;
      root.add(ball);

      if (occupied[cell.r + ',' + (cell.c + 1)]) {
        root.add(makeCylinderBetween(
          new THREE.Vector3(x, 0.57, z),
          new THREE.Vector3(x + 1, 0.57, z),
          0.25, material
        ));
      }
      if (occupied[(cell.r + 1) + ',' + cell.c]) {
        root.add(makeCylinderBetween(
          new THREE.Vector3(x, 0.57, z),
          new THREE.Vector3(x, 0.57, z + 1),
          0.25, material
        ));
      }
    });
  });

  return root;
}

function makeBoardScene(data, aspect, withShadows, cameraMode) {
  initThreeAssets();
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf7f9fb);
  var thumbnail = cameraMode === 'thumbnail';
  var camera = new THREE.PerspectiveCamera(thumbnail ? 27 : 30, aspect, 0.1, 60);
  if (thumbnail) {
    camera.position.set(0.8, 15.8, 4.6);
  } else {
    var frameScale = aspect < 1.72 ? 1.72 / aspect : 1;
    camera.position.set(7.7 * frameScale, 7.5 * frameScale, 8.9 * frameScale);
  }
  camera.lookAt(0, 0.1, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.52));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x536574, 0.32));
  var key = new THREE.DirectionalLight(0xfffdf7, 0.42);
  key.position.set(-4, 10, 6);
  key.castShadow = !!withShadows;
  if (withShadows) {
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 7;
    key.shadow.camera.bottom = -7;
  }
  scene.add(key);

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(28, 20), threeMaterials.floor);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.23;
  floor.receiveShadow = true;
  scene.add(floor);

  var board = buildBoard3D(data);
  board.rotation.y = thumbnail ? 0 : -0.09;
  scene.add(board);
  return {scene:scene, camera:camera, board:board};
}

function getThumbRenderer() {
  if (!thumbRenderer) {
    thumbRenderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
    thumbRenderer.setPixelRatio(1);
    thumbRenderer.setSize(380, 200, false);
    thumbRenderer.outputEncoding = THREE.sRGBEncoding;
  }
  return thumbRenderer;
}

function renderThumb(data, cacheKey) {
  if (thumbCache.has(cacheKey)) return thumbCache.get(cacheKey);
  var renderer = getThumbRenderer();
  var view = makeBoardScene(data, 1.9, false, 'thumbnail');
  renderer.render(view.scene, view.camera);
  var url = renderer.domElement.toDataURL('image/jpeg', 0.9);
  disposeBoardScene(view.scene);
  thumbCache.set(cacheKey, url);
  return url;
}

function disposeBoardScene(scene) {
  if (!scene) return;
  scene.traverse(function(object) {
    if (object.geometry) object.geometry.dispose();
  });
}

function runThumbQueue(deadline) {
  thumbRenderPending = false;
  var item = thumbQueue.shift();
  if (item && item.host.isConnected && mode3D) {
    try {
      var img = document.createElement('img');
      img.className = 'board-3d-thumb';
      img.alt = '';
      img.src = renderThumb(item.data, item.key);
      item.host.replaceChildren(img);
    } catch (e) {
      item.host.innerHTML = renderBoard(item.data, 160);
    }
  }
  if (thumbQueue.length) scheduleThumbQueue();
}

function scheduleThumbQueue() {
  if (thumbRenderPending) return;
  thumbRenderPending = true;
  if (window.requestIdleCallback) {
    requestIdleCallback(runThumbQueue, {timeout:120});
  } else {
    setTimeout(function() { runThumbQueue(); }, 16);
  }
}

  if (thumbCache.has(key)) {
    var img = document.createElement('img');
    img.className = 'board-3d-thumb';
    img.alt = '';
    img.src = thumbCache.get(key);
    host.replaceChildren(img);
  } else {
    thumbQueue.push({host:host, data:getRenderedBoard(false, idx), key:key});
  }
  scheduleThumbQueue();
}

function queueVisibleThumbnails() {
  thumbViewportPending = false;
  if (!mode3D) return;
  var lower = window.innerHeight + 140;
  var hosts = document.querySelectorAll('.board-3d-host');
  hosts.forEach(function(host) {
    var rect = host.getBoundingClientRect();
    if (rect.bottom >= -140 && rect.top <= lower) queueThumbHost(host);
  });
}

function scheduleVisibleThumbnails() {
  if (thumbViewportPending) return;
  thumbViewportPending = true;
  setTimeout(queueVisibleThumbnails, 0);
}

function queueGridThumbnails() {
  thumbQueue.length = 0;
  if (!thumbViewportEventsBound) {
    window.addEventListener('scroll', scheduleVisibleThumbnails, {passive:true});
    window.addEventListener('resize', scheduleVisibleThumbnails);
    thumbViewportEventsBound = true;
  }
  scheduleVisibleThumbnails();
}

function ensureModal3D() {
  if (modal3D || !initThreeAssets()) return modal3D;
  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  board3DContainer.appendChild(renderer.domElement);
  modal3D = {
    renderer:renderer, scene:null, camera:null, board:null,
    dragging:false, dragButton:0, lastX:0, lastY:0, raf:0,
    azimuth:0.72, elevation:0.58, radius:14.2,
    target:new THREE.Vector3(0, 0.1, 0)
  };

  board3DContainer.addEventListener('pointerdown', function(e) {
    modal3D.dragging = true;
    modal3D.dragButton = e.button;
    modal3D.lastX = e.clientX;
    modal3D.lastY = e.clientY;
    board3DContainer.classList.add('dragging');
    board3DContainer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  board3DContainer.addEventListener('pointermove', function(e) {
    if (!modal3D.dragging || !modal3D.camera) return;
    var dx = e.clientX - modal3D.lastX;
    var dy = e.clientY - modal3D.lastY;
    if (modal3D.dragButton === 0) {
      modal3D.azimuth -= dx * 0.008;
      modal3D.elevation = Math.max(0.06, Math.min(1.5, modal3D.elevation + dy * 0.007));
    } else {
      var panScale = modal3D.radius * 0.0014;
      var rightX = Math.cos(modal3D.azimuth);
      var rightZ = -Math.sin(modal3D.azimuth);
      var forwardX = Math.sin(modal3D.azimuth);
      var forwardZ = Math.cos(modal3D.azimuth);
      modal3D.target.x += (-dx * rightX - dy * forwardX) * panScale;
      modal3D.target.z += (-dx * rightZ - dy * forwardZ) * panScale;
      modal3D.target.x = Math.max(-4.5, Math.min(4.5, modal3D.target.x));
      modal3D.target.z = Math.max(-2.2, Math.min(2.2, modal3D.target.z));
    }
    modal3D.lastX = e.clientX;
    modal3D.lastY = e.clientY;
    updateModal3DCamera();
  });
  function stopDrag(e) {
    if (!modal3D) return;
    modal3D.dragging = false;
    board3DContainer.classList.remove('dragging');
    if (e && board3DContainer.hasPointerCapture(e.pointerId)) board3DContainer.releasePointerCapture(e.pointerId);
  }
  board3DContainer.addEventListener('pointerup', stopDrag);
  board3DContainer.addEventListener('pointercancel', stopDrag);
  board3DContainer.addEventListener('wheel', function(e) {
    if (!modal3D || !modal3D.camera) return;
    modal3D.radius *= Math.exp(e.deltaY * 0.001);
    modal3D.radius = Math.max(8.5, Math.min(24, modal3D.radius));
    updateModal3DCamera();
    e.preventDefault();
  }, {passive:false});
  board3DContainer.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  window.addEventListener('resize', resizeModal3D);
  return modal3D;
}

function updateModal3DCamera() {
  if (!modal3D || !modal3D.camera) return;
  var horizontal = modal3D.radius * Math.cos(modal3D.elevation);
  modal3D.camera.position.set(
    modal3D.target.x + horizontal * Math.sin(modal3D.azimuth),
    modal3D.target.y + modal3D.radius * Math.sin(modal3D.elevation),
    modal3D.target.z + horizontal * Math.cos(modal3D.azimuth)
  );
  modal3D.camera.lookAt(modal3D.target);
}

function resizeModal3D() {
  if (!modal3D || !mode3D) return;
  var width = Math.max(1, board3DContainer.clientWidth);
  var height = Math.max(1, board3DContainer.clientHeight);
  modal3D.renderer.setSize(width, height, false);
  modal3D.camera.aspect = width / height;
  modal3D.camera.updateProjectionMatrix();
}

function animateModal3D() {
  if (!modal3D) return;
  cancelAnimationFrame(modal3D.raf);
  function frame() {
    if (!mode3D || !modalOverlay.classList.contains('open')) return;
    modal3D.renderer.render(modal3D.scene, modal3D.camera);
    modal3D.raf = requestAnimationFrame(frame);
  }
  frame();
}

function renderModal3D() {
  var view3D = ensureModal3D();
  if (!view3D) return;
  var data = getRenderedBoard(showingSolution, current - 1);
  var width = Math.max(1, board3DContainer.clientWidth);
  var height = Math.max(1, board3DContainer.clientHeight);
  var built = makeBoardScene(data, width / height, true, 'modal');
  disposeBoardScene(view3D.scene);
  view3D.scene = built.scene;
  view3D.camera = built.camera;
  view3D.board = built.board;
  updateModal3DCamera();
  resizeModal3D();
  animateModal3D();
}

function activeFilter() {
  var active = document.querySelector('.filter-btn.active');
  return active ? active.dataset.level : 'all';
}

function set3DMode(on) {
  if (on && !window.THREE) {
    mode3DToggle.disabled = true;
    mode3DToggle.title = '3D renderer could not be loaded';
    return;
  }
  if (on && editMode) setEditMode(false);
  mode3D = !!on;
  document.body.classList.toggle('mode-3d', mode3D);
  mode3DToggle.classList.toggle('on', mode3D);
  mode3DToggle.textContent = '3D Mode: ' + (mode3D ? 'ON' : 'OFF');
  try { localStorage.setItem(MODE_3D_KEY, mode3D ? '1' : '0'); } catch(e) {}
  buildGrid(activeFilter());
  if (modalOverlay.classList.contains('open')) {
    renderModalViews();
  }
}

mode3DToggle.addEventListener('click', function() { set3DMode(!mode3D); });

function buildGrid(filter) {
  grid.innerHTML = '';
  for (let i = 1; i <= TOTAL; i++) {
    const lvl = getLevel(i);
    if (filter !== 'all' && lvl.name.toLowerCase() !== filter) continue;
    const card = document.createElement('div');
    card.className = 'card ' + lvl.className;
    card.innerHTML = (mode3D
      ? '<div class="board-3d-host" data-board-index="' + (i-1) + '"></div>'
      : renderBoard(getRenderedBoard(false, i-1), 160)) +
      '<div class="card-info"><div class="num">#' + i + '</div><div class="level">' + lvl.name + '</div></div>';
    card.addEventListener('click', function() { openModal(i); });
    grid.appendChild(card);
  }
  if (mode3D) queueGridThumbnails();
}

function closeEditorDialogs() {
  var co = document.getElementById('confirmOverlay');
  if (co) co.style.display = 'none';
  if (selectedCells.length > 0) clearSelection();
}

function openModal(n) {
  closeEditorDialogs();
  current = n; showingSolution = false;
  selectedCells = [];
  solutionSvgContainer.classList.remove('show');
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  updateModal();
  renderModalViews();
}

function updateModal() {
  const lvl = getLevel(current);
  modalTitle.textContent = 'Puzzle ' + current + ' - ' + lvl.name;
  btnToggle.textContent = showingSolution ? 'Hide Solution' : 'Show Solution';
  btnPrev.disabled = current <= 1;
  btnNext.disabled = current >= TOTAL;
}

function closeModal() {
  closeEditorDialogs();
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

function toggleSolution() {
  showingSolution = !showingSolution;
  solutionSvgContainer.classList.toggle('show', showingSolution);
  btnToggle.textContent = showingSolution ? 'Hide Solution' : 'Show Solution';
  if (mode3D) renderModal3D();
}

function prevPuzzle() { if (current > 1) { current--; openModal(current); } }
function nextPuzzle() { if (current < TOTAL) { current++; openModal(current); } }

document.getElementById('filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  e.target.classList.add('active');
  buildGrid(e.target.dataset.level);
});

btnToggle.addEventListener('click', toggleSolution);
btnPrev.addEventListener('click', prevPuzzle);
btnNext.addEventListener('click', nextPuzzle);
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', function(e) {
  if (!modalOverlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') prevPuzzle();
  if (e.key === 'ArrowRight') nextPuzzle();
  if (e.key === ' ') { e.preventDefault(); toggleSolution(); }
});

// ===================== EDITOR MODE =====================
const COLOR_NAMES = ['Pink','Red','Cyan','Orange','Green','Yellow','Purple','Navy','LtBlue','LtGreen'];
const EDIT_KEY = 'iq_fit_edits_v2';
let editMode = false;
let edits = [];

try { edits = JSON.parse(localStorage.getItem(EDIT_KEY)) || []; } catch(e) {}

function getRenderedBoard(isSol, idx) {
  var src = isSol ? DATA.s[idx] : DATA.p[idx];
  var board = [];
  for (var r = 0; r < 5; r++) {
    board[r] = [];
    for (var c = 0; c < 10; c++) {
      board[r][c] = {t: src[r][c].t, id: src[r][c].id};
    }
  }
  for (var e of edits) {
    if (e.sol === isSol && e.idx === idx) {
      board[e.r][e.c] = e.nid < 0 ? {t:'e'} : {t:'p', id:e.nid};
    }
  }
  return board;
}
var editToggle = document.getElementById('editToggle');

function setEditMode(on) {
  if (on && mode3D) set3DMode(false);
  editMode = !!on;
  editToggle.textContent = 'Edit Mode: ' + (editMode ? 'ON' : 'OFF');
  editToggle.classList.toggle('on', editMode);
  document.body.classList.toggle('editor-active', editMode);
}

editToggle.addEventListener('click', function() { setEditMode(!editMode); });

function renderModalViews() {
  if (mode3D) {
    renderModal3D();
    return;
  }
  var idx = current - 1;
  var pSels = selectedCells.filter(function(c) { return !c.isSol; });
  var sSels = selectedCells.filter(function(c) { return c.isSol; });
  puzzleSvgContainer.innerHTML = renderBoard(getRenderedBoard(false, idx), 640, pSels);
  solutionSvgContainer.innerHTML = renderBoard(getRenderedBoard(true, idx), 640, sSels);
}

function initPalette() {
  var w = document.getElementById('paletteWrap');
  if (w.children.length > 0) return;
  for (var i = 0; i < 10; i++) {
    var b = document.createElement('button');
    b.className = 'palette-swatch';
    b.dataset.idx = i;
    b.style.background = PIECE_COLORS[i];
    b.innerHTML = '<span class="idx">' + i + '</span>';
    b.title = COLOR_NAMES[i];
    b.addEventListener('click', function() { palettePick(parseInt(this.dataset.idx)); });
    w.appendChild(b);
  }
  // Empty / erase swatch
  var e = document.createElement('button');
  e.className = 'palette-swatch empty-swatch';
  e.dataset.idx = -1;
  e.style.background = '#e0e0e0';
  e.style.border = '2px solid #888';
  e.innerHTML = '<span class="idx">E</span>';
  e.title = 'Empty';
  e.addEventListener('click', function() { palettePick(-1); });
  w.appendChild(e);
}
initPalette();

var selectedCells = [];

try { mode3D = localStorage.getItem(MODE_3D_KEY) === '1'; } catch(e) {}
document.body.classList.toggle('mode-3d', mode3D);
mode3DToggle.classList.toggle('on', mode3D);
mode3DToggle.textContent = '3D Mode: ' + (mode3D ? 'ON' : 'OFF');
buildGrid(activeFilter());

function toggleSelectedCell(row, col, isSol, shiftKey) {
  if (shiftKey) {
    var idx = -1;
    for (var i = 0; i < selectedCells.length; i++) {
      var c = selectedCells[i];
      if (c.row === row && c.col === col && c.isSol === isSol) { idx = i; break; }
    }
    if (idx >= 0) {
      selectedCells.splice(idx, 1);
    } else {
      selectedCells.push({row:row, col:col, isSol:isSol});
    }
  } else {
    selectedCells = [{row:row, col:col, isSol:isSol}];
  }
  renderModalViews();
  updatePaletteActive();
}

function updatePaletteActive() {
  document.querySelectorAll('.palette-swatch').forEach(function(el) { el.classList.remove('active'); });
  if (selectedCells.length === 1) {
    var c = selectedCells[0];
    var data = getRenderedBoard(c.isSol, current-1);
    var cell = data[c.row][c.col];
    var curId = cell.t === 'p' ? cell.id : -1;
    document.querySelectorAll('.palette-swatch').forEach(function(el) {
      el.classList.toggle('active', parseInt(el.dataset.idx) === curId);
    });
  }
}

function clearSelection() {
  selectedCells = [];
  renderModalViews();
  document.querySelectorAll('.palette-swatch').forEach(function(el) { el.classList.remove('active'); });
}

function palettePick(newId) {
  if (selectedCells.length === 0) return;
  var n = selectedCells.length;
  var msg;
  if (newId < 0) {
    msg = 'Clear ' + n + ' cell' + (n > 1 ? 's' : '') + ' to Empty?';
    document.getElementById('confirmSwatch').style.background = '#ffffff';
    document.getElementById('confirmSwatch').style.border = '2px dashed #aaa';
  } else {
    msg = 'Apply ' + COLOR_NAMES[newId] + ' to ' + n + ' cell' + (n > 1 ? 's' : '') + '?';
    document.getElementById('confirmSwatch').style.background = PIECE_COLORS[newId];
    document.getElementById('confirmSwatch').style.border = 'none';
  }
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmOverlay').style.display = 'flex';
  document.getElementById('confirmOverlay')._nid = newId;
}

function confirmEdit() {
  var ov = document.getElementById('confirmOverlay');
  var newId = ov._nid;
  ov.style.display = 'none';
  var idx = current - 1;
  var hint = document.querySelector('.palette-hint');
  var cells = selectedCells.slice();
  try {
    for (var i = 0; i < cells.length; i++) {
      edits.push({idx:idx, sol:cells[i].isSol, r:cells[i].row, c:cells[i].col, nid:newId});
    }
    localStorage.setItem(EDIT_KEY, JSON.stringify(edits));
    thumbCache.clear();
    selectedCells = [];
    document.querySelectorAll('.palette-swatch').forEach(function(el) { el.classList.remove('active'); });
    renderModalViews();
    var cards = grid.querySelectorAll('.card');
    for (var ci = 0; ci < cards.length; ci++) {
      var num = cards[ci].querySelector('.num');
      if (num && num.textContent === '#' + (idx+1)) {
        var info = cards[ci].querySelector('.card-info');
        cards[ci].innerHTML = renderBoard(getRenderedBoard(false, idx), 160) + (info ? info.outerHTML : '');
        break;
      }
    }
    if (hint) hint.textContent = cells.length + ' cell' + (cells.length > 1 ? 's' : '') + ' updated';
  } catch(e) {
    if (hint) hint.textContent = 'ERR: '+e.message;
  }
}

function cancelEdit() { document.getElementById('confirmOverlay').style.display = 'none'; }

function handleSvgClick(e) {
  if (!editMode) return;
  var t = e.target;
  if (t.tagName !== 'rect' || !t.hasAttribute('data-r')) return;
  var row = parseInt(t.getAttribute('data-r'));
  var col = parseInt(t.getAttribute('data-c'));
  // Determine actual container: if the click landed on the solution overlay
  // but the solution isn't shown, the click was meant for the puzzle board
  var isSol = t.closest('#solutionSvgContainer') !== null;
  if (isSol && !solutionSvgContainer.classList.contains('show')) isSol = false;
  toggleSelectedCell(row, col, isSol, e.shiftKey);
}

puzzleSvgContainer.addEventListener('click', handleSvgClick);
solutionSvgContainer.addEventListener('click', handleSvgClick);

document.getElementById('confirmOk').addEventListener('click', confirmEdit);
document.getElementById('confirmCancel').addEventListener('click', cancelEdit);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').style.display === 'flex') cancelEdit();
    else if (selectedCells.length > 0) clearSelection();
  }
});
</script>
</body>
</html>
